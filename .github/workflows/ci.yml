name: ci

# The suites existed long before this workflow did — backend, frontend and
# deploy-check suites — and nothing ran them. A NameError that stopped
# the app importing at all shipped to main because the only automated jobs were
# security scanners and the release build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check app tests
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # oxlint rather than ESLint: @typescript-eslint's parser declares
      # `typescript: ">=4.8.4 <6.1.0"` and crashes on this project's TS 7.
      # The delegated pass resolved that by downgrading TypeScript 7 -> 5.7,
      # which is backwards — the compiler is not the thing to bend. oxlint
      # carries the react-hooks and jsx-a11y rules without depending on the
      # typescript package at all. Exits non-zero on errors; warnings are
      # visible and do not fail, which is the gate this job is for.
      - run: npm run lint --prefix frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # weasyprint is imported lazily everywhere it is used, so its native
      # dependencies are not needed to run the suite.
      - run: pip install -r backend/requirements-dev.txt
      # Coverage rides the fast suite's existing run (no second full pass) and
      # is gated at 82% — three points under the 85% the suite measured when the
      # floor was set. The floor catches the number silently falling, without
      # failing a run on normal non-deterministic wobble.
      - run: python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=82
        working-directory: backend
      # The benchmarks are deselected from the default run (pytest.ini addopts)
      # because they are measurements, not gates. They still run here: each one
      # asserts only on correctness — page ids and ordering, cache hit/miss
      # counts — and prints its timings as evidence, so there is nothing
      # timing-dependent to make this flaky. Without a CI step they would rot
      # unnoticed, which is exactly what happened to the numbers they replace.
      - run: python -m pytest -m bench -q
        working-directory: backend

  contract:
    name: API contract (OpenAPI, property-based)
    runs-on: ubuntu-latest
    # Was manual-only while the suite could not finish: it parked forever on the
    # SSE operation, whose `case.call()` never returned, and tripped a
    # `filter_too_much` health check on a different operation each run. Both are
    # fixed (see test_openapi_contract.py) and it now runs to completion in
    # ~75s, so it gates every push like the rest.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      # Excluded from the default run by pytest.ini's addopts because it is
      # generated per operation and takes minutes; it gets its own job so a
      # slow property search never makes the fast suite feel slow.
      - run: python -m pytest tests/test_openapi_contract.py -m contract -q
        working-directory: backend

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run test --prefix frontend
      # `build` also runs check:selfcontained, which fails on any remote
      # <link>/<script>/url() in the output.
      - run: npm run build --prefix frontend

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      # The desktop shell is two plain-JS files (main.js, preload.js): there is
      # no TypeScript to typecheck, and `build` (electron-builder) packages a
      # platform binary — a separate decision, not gated here. The gate is the
      # lint pass (oxlint, added alongside this job), plus the audit step in
      # security.yml.
      - run: npm run lint --prefix desktop

  desktop-package:
    name: Desktop package (build & boot)
    runs-on: ubuntu-latest
    # The `desktop` job above only lints the two JS files, so a packaged app
    # that cannot boot would still ship green. This job is the guard that was
    # missing: it builds the real artifact (PyInstaller backend + electron-builder
    # shell) and boots it headless, waiting on the existing GET /health — the
    # same endpoint the shell itself waits on. It fails if the backend does not
    # come up, which is exactly what a missing extraResources bundle produces.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # Electron creates a real GTK window, which needs a display. xvfb provides
      # a virtual one; the boot check below prefers xvfb-run and only falls back
      # to Chromium's offscreen headless mode when it is absent.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci --prefix desktop
      - run: npm ci --prefix frontend
      # extraResources copies frontend/dist into the artifact, so the SPA must
      # be built before electron-builder runs — a stale bundle tests stale code.
      - run: npm run build --prefix frontend
      # PyInstaller freezes the backend into desktop/backend/reqmesh-backend,
      # which electron-builder then copies into the app's resources.
      # PyInstaller lives in its own hash-pinned file: requirements.txt's hashes
      # put pip into --require-hashes mode, where an unpinned package named on
      # the same command line is rejected outright.
      - run: pip install -r backend/requirements.txt -r backend/requirements-desktop.txt
      - run: bash scripts/build_desktop_backend.sh
        env:
          PYTHON: python
      # AppImage, not `dir` — this is the exact target release.yml publishes, and
      # a packaging path that only ever runs at release time is one CI cannot
      # fail on. The AppImage build still emits release/linux-unpacked, which is
      # what the boot check below launches.
      - run: npx electron-builder --linux AppImage
        working-directory: desktop
      # The job is the test: boot the packaged app headless and wait for /health.
      - run: bash scripts/desktop_boot_check.sh

  deploy-checks:
    name: Deploy script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Static analysis on the installer scripts, the most security-sensitive
      # code outside the app (run as root on a fresh host). Severity `warning`:
      # `error` and `warning` are the levels that catch real defects (unquoted
      # array expansion, dead variables); `info`/`style` are dominated by
      # intentional idioms shellcheck only flags at low confidence (the test
      # harness's `&& ok || bad`, single-quoted grep patterns, `source` of
      # dynamically-located files), so they are deliberately out of scope.
      # scripts/updater/watch.sh is POSIX sh and is linted as sh via its shebang.
      # Pinned by version + SHA-256 rather than using the runner image's
      # shellcheck: the runner's version changes with the image, and a linter
      # bump that adds a new check would fail this job on an unrelated PR. Same
      # pattern as the pinned tectonic in Dockerfile.prod.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" -o /tmp/shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - run: shellcheck -S warning scripts/*.sh scripts/*/*.sh
      # Discover test_*.sh suites via run.sh — a hardcoded roster silently skips
      # a newly added suite (comment at scripts/tests/run.sh:19-21).
      - run: bash scripts/tests/run.sh

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # 30 minutes against a ~18-minute run. This is the guard that matters: the
    # v0.3.4 release hung in `playwright install --with-deps` for 5h59m25s
    # against azure.archive.ubuntu.com before GitHub's 360-minute default killed
    # it. A stalled mirror is now a 30-minute failure, not a lost afternoon.
    #
    # Running this job in mcr.microsoft.com/playwright was tried and reverted:
    # the browsers come pre-installed, but `actions/setup-python` cannot provide
    # a working pip inside that image and the job dies on
    # `spawn /__t/Python/3.12.14/x64/bin/pip ENOENT` before installing the
    # backend. If you retry it, the backend's Python is the problem to solve
    # first — not the browsers.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      # The e2e fixture serves frontend/dist, so a stale build tests stale code.
      - run: npm run build --prefix frontend
      # `npx --prefix` is not a thing — resolve the local binary by running in
      # the package directory.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  schema-freshness:
    name: Generated-code freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python gen_schemas.py
        working-directory: backend
      - run: git diff --exit-code schemas/
      # The write models are generated into the frontend tree the same way the
      # schemas are into schemas/ — a Pydantic change that is not regenerated
      # must fail the build rather than let the client types drift.
      - run: python gen_write_models.py
        working-directory: backend
      - run: git diff --exit-code frontend/src/api/generated/writeModels.ts
      # The API reference in docs/api.md is generated from the OpenAPI schema the
      # same way; a route change that is not regenerated must fail the build
      # rather than let the reference drift from the live route table.
      - run: python gen_api_reference.py
        working-directory: backend
      - run: git diff --exit-code docs/api.md
      # The frontend's rule table is generated from PATTERN_RULES the same way;
      # a rule change that is not regenerated must fail the build rather than
      # let the live quality score drift from the server's.
      - run: python gen_quality_rules.py
        working-directory: backend
      - run: git diff --exit-code frontend/src/lib/generated/qualityRules.ts
