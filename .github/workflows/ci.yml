name: ci

# The suites existed long before this workflow did — 786 backend tests, 99
# frontend, 231 deploy checks — and nothing ran them. A NameError that stopped
# the app importing at all shipped to main because the only automated jobs were
# security scanners and the release build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check app tests
        working-directory: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # oxlint rather than ESLint: @typescript-eslint's parser declares
      # `typescript: ">=4.8.4 <6.1.0"` and crashes on this project's TS 7.
      # The delegated pass resolved that by downgrading TypeScript 7 -> 5.7,
      # which is backwards — the compiler is not the thing to bend. oxlint
      # carries the react-hooks and jsx-a11y rules without depending on the
      # typescript package at all. Exits non-zero on errors; warnings are
      # visible and do not fail, which is the gate this job is for.
      - run: npm run lint --prefix frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # weasyprint is imported lazily everywhere it is used, so its native
      # dependencies are not needed to run the suite.
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests/ -q
        working-directory: backend

  contract:
    name: API contract (OpenAPI, property-based)
    runs-on: ubuntu-latest
    # Manual only, for now. The suite is real but not yet trustworthy as a gate:
    # a full local run took over 25 minutes and parked on a single operation
    # whose `case.call()` never returned, and it reported one genuine failure
    # that has not been triaged. Wiring that into every push would give a red or
    # hung CI on day one, which teaches people to ignore it. Run it from the
    # Actions tab (or `pytest -m contract`), fix the hang and the failure, then
    # drop this condition.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      # Excluded from the default run by pytest.ini's addopts because it is
      # generated per operation and takes minutes; it gets its own job so a
      # slow property search never makes the fast suite feel slow.
      - run: python -m pytest tests/test_openapi_contract.py -m contract -q
        working-directory: backend

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run test --prefix frontend
      # `build` also runs check:selfcontained, which fails on any remote
      # <link>/<script>/url() in the output.
      - run: npm run build --prefix frontend

  deploy-checks:
    name: Deploy script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/tests/test_deploy.sh

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      # The e2e fixture serves frontend/dist, so a stale build tests stale code.
      - run: npm run build --prefix frontend
      # `npx --prefix` is not a thing — resolve the local binary by running in
      # the package directory.
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
