name: ci

# The suites existed long before this workflow did — backend, frontend and
# deploy-check suites — and nothing ran them. A NameError that stopped
# the app importing at all shipped to main because the only automated jobs were
# security scanners and the release build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check app tests
        working-directory: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # oxlint rather than ESLint: @typescript-eslint's parser declares
      # `typescript: ">=4.8.4 <6.1.0"` and crashes on this project's TS 7.
      # The delegated pass resolved that by downgrading TypeScript 7 -> 5.7,
      # which is backwards — the compiler is not the thing to bend. oxlint
      # carries the react-hooks and jsx-a11y rules without depending on the
      # typescript package at all. Exits non-zero on errors; warnings are
      # visible and do not fail, which is the gate this job is for.
      - run: npm run lint --prefix frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # weasyprint is imported lazily everywhere it is used, so its native
      # dependencies are not needed to run the suite.
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests/ -q
        working-directory: backend

  contract:
    name: API contract (OpenAPI, property-based)
    runs-on: ubuntu-latest
    # Was manual-only while the suite could not finish: it parked forever on the
    # SSE operation, whose `case.call()` never returned, and tripped a
    # `filter_too_much` health check on a different operation each run. Both are
    # fixed (see test_openapi_contract.py) and it now runs to completion in
    # ~75s, so it gates every push like the rest.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      # Excluded from the default run by pytest.ini's addopts because it is
      # generated per operation and takes minutes; it gets its own job so a
      # slow property search never makes the fast suite feel slow.
      - run: python -m pytest tests/test_openapi_contract.py -m contract -q
        working-directory: backend

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run test --prefix frontend
      # `build` also runs check:selfcontained, which fails on any remote
      # <link>/<script>/url() in the output.
      - run: npm run build --prefix frontend

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      # The desktop shell is two plain-JS files (main.js, preload.js): there is
      # no TypeScript to typecheck, and `build` (electron-builder) packages a
      # platform binary — a separate decision, not gated here. The gate is the
      # lint pass (oxlint, added alongside this job), plus the audit step in
      # security.yml.
      - run: npm run lint --prefix desktop

  deploy-checks:
    name: Deploy script checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Discover test_*.sh suites via run.sh — a hardcoded roster silently skips
      # a newly added suite (comment at scripts/tests/run.sh:19-21).
      - run: bash scripts/tests/run.sh

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run in the official Playwright container so the browsers and their system
    # dependencies come pre-installed: no `npx playwright install --with-deps`
    # shells out to apt-get against azure.archive.ubuntu.com (the v0.3.4 release
    # hung there for 5h59m25s). The image tag must match the `@playwright/test`
    # version in frontend/package.json — the browser bundle and the client must
    # move together. Bump both, never one.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # The image ships Node.js pre-installed; frontend has no `engines` pin, so
      # setup-node is dropped and the build uses the image's node.
      - run: pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      # The e2e fixture serves frontend/dist, so a stale build tests stale code.
      - run: npm run build --prefix frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  schema-freshness:
    name: Generated-code freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python gen_schemas.py
        working-directory: backend
      - run: git diff --exit-code schemas/
      # The write models are generated into the frontend tree the same way the
      # schemas are into schemas/ — a Pydantic change that is not regenerated
      # must fail the build rather than let the client types drift.
      - run: python gen_write_models.py
        working-directory: backend
      - run: git diff --exit-code frontend/src/api/generated/writeModels.ts
      # The API reference in docs/api.md is generated from the OpenAPI schema the
      # same way; a route change that is not regenerated must fail the build
      # rather than let the reference drift from the live route table.
      - run: python gen_api_reference.py
        working-directory: backend
      - run: git diff --exit-code docs/api.md
      # The frontend's rule table is generated from PATTERN_RULES the same way;
      # a rule change that is not regenerated must fail the build rather than
      # let the live quality score drift from the server's.
      - run: python gen_quality_rules.py
        working-directory: backend
      - run: git diff --exit-code frontend/src/lib/generated/qualityRules.ts
