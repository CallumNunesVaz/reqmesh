name: Release

# Cut by pushing a tag (scripts/release.sh does this). Builds the bundle,
# publishes a GitHub Release with the tarball attached, and pushes the Docker
# image to the GitHub Container Registry.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create releases + attach assets
  packages: write   # push to ghcr.io
  id-token: write   # OIDC token for cosign keyless (keyless) image signing

jobs:
  # Gate the release on the full CI suite.
  #
  # We use `workflow_call` (not `workflow_run`) so the CI pipeline runs inline as
  # a job dependency: if any CI job fails, the release stops before publishing.
  # `workflow_run` fires *after* CI finishes and can only gate the whole release
  # workflow — if the release workflow needed a pre-check of its own that would
  # still slip through. A called workflow runs as part of the release trigger, so
  # the tag-version verification below and the CI gate share the same fate.
  ci:
    name: CI
    # No timeout-minutes here: GitHub rejects it on a job that calls a reusable
    # workflow, and the whole release fails to even start. The called workflow's
    # own jobs each carry one, which is where the bound belongs anyway.
    uses: ./.github/workflows/ci.yml

  bundle:
    name: Build bundle & publish release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need tags/history for release notes

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag matches VERSION file
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VER="$(cat VERSION)"
          if [ "$TAG" != "$FILE_VER" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($FILE_VER)"
            exit 1
          fi

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install backend deps (for example seeding)
        run: pip install -r backend/requirements.txt

      - name: Extract release notes from tag
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Write Ed25519 signing key
        env:
          REQMESH_SIGNING_KEY: ${{ secrets.REQMESH_SIGNING_KEY }}
        run: |
          if [ -z "${REQMESH_SIGNING_KEY:-}" ]; then
            echo "::error::REQMESH_SIGNING_KEY secret is not set — refusing to publish an unsigned bundle."
            exit 1
          fi
          printf '%s\n' "$REQMESH_SIGNING_KEY" > signing-key.pem
          chmod 600 signing-key.pem

      - name: Build bundle
        env:
          PYTHON: python
          RELEASE_NOTES_FILE: RELEASE_NOTES.md
          # Ed25519 private key (PEM) from a repo secret. build_bundle.sh emits
          # dist/reqmesh-vX.Y.Z.tar.gz.sig over the raw tarball bytes; the verify
          # side checks it with RT_UPDATE_PUBLIC_KEY (the .pub asset below).
          REQMESH_SIGNING_KEY: signing-key.pem
        run: bash scripts/build_bundle.sh

      - name: Derive public key asset
        run: |
          VERSION="$(cat VERSION)"
          # Ed25519 SubjectPublicKeyInfo is 12 bytes of DER header + the 32-byte
          # raw key. RT_UPDATE_PUBLIC_KEY wants exactly those 32 bytes, base64.
          openssl pkey -in signing-key.pem -pubout -outform DER \
            | tail -c 32 | base64 -w0 > "dist/reqmesh-v${VERSION}.pub"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            --title "reqmesh v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            "dist/reqmesh-v${VERSION}.tar.gz" \
            "dist/reqmesh-v${VERSION}.tar.gz.sha256" \
            "dist/reqmesh-v${VERSION}.tar.gz.sig" \
            "dist/reqmesh-v${VERSION}.pub"

  desktop:
    name: Package & attach desktop app
    needs: bundle   # the release must exist before an asset can be attached
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Electron needs a display to boot; the smoke check below runs under xvfb,
      # exactly as the CI desktop-package job does.
      - run: sudo apt-get update && sudo apt-get install -y xvfb

      - run: npm ci --prefix desktop
      - run: npm ci --prefix frontend

      # extraResources copies frontend/dist into the artifact, so the SPA has to
      # be built before electron-builder runs.
      - run: npm run build --prefix frontend

      # PyInstaller lives in its own hash-pinned file: requirements.txt's hashes
      # put pip into --require-hashes mode, where an unpinned package named on
      # the same command line is rejected outright.
      - run: pip install -r backend/requirements.txt -r backend/requirements-desktop.txt
      - run: bash scripts/build_desktop_backend.sh
        env:
          PYTHON: python

      - run: npx electron-builder --linux AppImage
        working-directory: desktop

      # Boot the packaged artifact before attaching it. CI already does this on
      # every push, but the thing published here is a *different build* of it —
      # attaching an AppImage nobody has launched is how a desktop app ships
      # broken to the only users who cannot easily report why.
      - run: bash scripts/desktop_boot_check.sh

      - name: Attach AppImage to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat VERSION)"
          SRC="$(find desktop/release -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [ -z "$SRC" ]; then
            echo "::error::no AppImage found under desktop/release"
            ls -la desktop/release || true
            exit 1
          fi
          # Rename to the same reqmesh-vX.Y.Z-* convention as the other assets;
          # electron-builder's default is "reqmesh-<version>.AppImage".
          ASSET="reqmesh-v${VERSION}-linux-x86_64.AppImage"
          mv "$SRC" "$ASSET"
          sha256sum "$ASSET" > "${ASSET}.sha256"
          ls -lh "$ASSET"
          gh release upload "$GITHUB_REF_NAME" "$ASSET" "${ASSET}.sha256" --clobber

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: bundle   # the release must exist before we attach the image archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # cosign is not on the runner. Pin the binary by version + SHA-256 (the
      # same values the updater sidecar uses), matching the tectonic pattern in
      # Dockerfile.prod — rather than pulling an unpinned installer action.
      - name: Install cosign
        env:
          COSIGN_VERSION: v2.5.0
          COSIGN_SHA256: 1f6c194dd0891eb345b436bb71ff9f996768355f5e0ce02dde88567029ac2188
        run: |
          curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /usr/local/bin/cosign
          echo "${COSIGN_SHA256}  /usr/local/bin/cosign" | sha256sum -c -
          chmod +x /usr/local/bin/cosign

      - name: Build and push image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker build -f Dockerfile.prod \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="${GITHUB_SHA}" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          # Sign both tags keylessly. cosign derives the OIDC identity from this
          # workflow's id-token — `https://github.com/<repo>/.github/workflows/
          # release.yml@refs/tags/vX.Y.Z` — which is exactly the identity the
          # updater sidecar requires. A signature with no identity constraint
          # would prove only that *something* signed it, not that this release
          # workflow did.
          cosign sign --yes "$IMAGE:$VERSION"
          cosign sign --yes "$IMAGE:latest"

      # Publish an SPDX SBOM alongside the image (audit finding T7 / F-26).
      # syft runs digest-pinned as a container, matching the trivy convention in
      # security.yml. The SBOM is attached to the release below.
      - name: Generate image SBOM
        env:
          SYFT: anchore/syft@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c # v1.51.1
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$SYFT" "$IMAGE:$VERSION" -o spdx-json \
            > "reqmesh-v${VERSION}.sbom.spdx.json"

      - name: Attach SBOM to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SBOM="reqmesh-v${VERSION}.sbom.spdx.json"
          gh release upload "$GITHUB_REF_NAME" "$SBOM" --clobber \
            || echo "::warning::Could not attach $SBOM; the image and release are still published."

      # The archive's size is logged because it is the one number that would
      # explain a later upload failure that the retry loop cannot absorb.
      # (Disk exhaustion was the first theory for v0.2.5 and the log disproved
      # it — see the next step.)
      - name: Save image archive for offline updates
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker save "$IMAGE:$VERSION" | gzip > "reqmesh-v${VERSION}-image.tar.gz"
          ls -lh "reqmesh-v${VERSION}-image.tar.gz"

      # Retries because v0.2.5 failed here with a transient upload 404:
      #
      #   HTTP 404: Not Found
      #   (https://uploads.github.com/repos/.../releases/369981735/assets?...)
      #
      # against a release the previous job had created minutes earlier and
      # which plainly existed — the release id is right there in the URL. So it
      # is the uploads endpoint not yet resolving the freshly created release,
      # not permissions (contents: write is set) and not disk.
      #
      # Never fails the release, for the same reason the prune step below does
      # not: by this point the tarball is attached and the image is pushed to
      # ghcr, so the release is complete and usable. This archive is the
      # offline `docker load` convenience copy. Marking the whole release failed
      # when it has in fact shipped is worse than missing the asset — a red
      # release that actually published is exactly the ambiguity that let
      # 0.2.4's red CI look normal.
      #
      # It still has to be *visible*, so a failure emits a warning annotation
      # rather than passing silently.
      - name: Attach image archive to the release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="reqmesh-v${VERSION}-image.tar.gz"
          for attempt in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber; then
              echo "attached $ARCHIVE on attempt $attempt"
              exit 0
            fi
            echo "upload attempt $attempt failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::warning::Could not attach $ARCHIVE to $GITHUB_REF_NAME after 3 attempts. The release and the ghcr image are published; only the offline image archive is missing. Re-attach with: gh release upload $GITHUB_REF_NAME $ARCHIVE --clobber"
          exit 1

      # Each archive is ~150 MB and only the newest are ever used, so without
      # this the release assets grow by that much every patch. Keeps the current
      # release plus one rollback target. Never fails the release: the artifacts
      # are already published by this point, and a cleanup problem is not a
      # broken release.
      - name: Prune image archives from older releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune_release_images.sh --keep=2

      # The AppImage is ~157 MB per release and, unlike the server bundle, has
      # no in-place updater that could want an older one — a desktop user
      # re-downloads. Same keep-window as the image archives.
      - name: Prune desktop AppImages from older releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune_release_images.sh --keep=2 --suffix=.AppImage
