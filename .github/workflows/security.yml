name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 17 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: semgrep ci --config p/python --config p/react --config p/secrets --config p/dockerfile
        env:
          SEMGREP_RULES: p/default

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install bandit[toml] pip-audit
      - run: bandit -r backend/app -ll -f sarif -o bandit.sarif
        continue-on-error: true
      - run: pip-audit -r backend/requirements.txt
      - uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        if: always()
        with:
          sarif_file: bandit.sarif

  node-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # --omit=dev: the frontend ships as static files built by Vite, so only
      # runtime dependencies reach a user. The dev toolchain (vite, vitest,
      # esbuild) carries its own advisories — real, but they describe a dev
      # server that is never exposed in a deployment, and clearing them means
      # a vite 5->8 / vitest 2->4 major bump. Those are tracked separately;
      # gating releases on them would have blocked shipping for a risk that
      # is not in the artifact. Runtime dependencies are still gated at high.
      - run: npm audit --prefix frontend --audit-level=high --omit=dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f Dockerfile.prod -t reqmesh:ci .
      - uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: reqmesh:ci
          severity: HIGH,CRITICAL
          # ignore-unfixed: a Debian base image always carries some HIGH CVEs
          # that upstream has not patched. Failing on those makes the gate
          # unsatisfiable — there is no action that clears it — so it stops
          # being read. Fail only on CVEs that a rebuild or a version bump can
          # actually fix; the Dockerfile now runs apt-get upgrade so those get
          # picked up. Unfixed CVEs are still reported in the SARIF upload
          # below, they just don't block.
          ignore-unfixed: true
          exit-code: '1'
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@a2983b8bed1923f44751c5c43237f479442827b3 # v3
        if: always()
        with:
          sarif_file: trivy.sarif
