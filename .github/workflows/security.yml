name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 17 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          language: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep ci --config p/python --config p/react --config p/secrets --config p/dockerfile
        env:
          SEMGREP_RULES: p/default

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The `sarif` extra supplies the -f sarif formatter. Without it bandit
      # exits 2 ("invalid choice: 'sarif'"), continue-on-error hides that, no
      # bandit.sarif is written, and the upload step below fails the job — so
      # this reported red for a missing formatter while pip-audit was green
      # and bandit had never actually run.
      - run: pip install 'bandit[toml,sarif]' pip-audit
      # `continue-on-error: true` here hid a *tool* failure as well as findings,
      # which is how the missing formatter went unnoticed. bandit exits 1 for
      # findings — reported via SARIF, not a build failure — and 2+ when bandit
      # itself could not run, which must never pass silently.
      - run: |
          set +e
          bandit -r backend/app -ll -f sarif -o bandit.sarif
          code=$?
          if [ "$code" -gt 1 ]; then
            echo "::error::bandit exited $code — it failed to run, rather than finding issues"
            exit "$code"
          fi
      - run: pip-audit -r backend/requirements.txt
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always() && hashFiles('bandit.sarif') != ''
        with:
          sarif_file: bandit.sarif

  node-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      # --omit=dev: the frontend ships as static files built by Vite, so only
      # runtime dependencies reach a user. The dev toolchain (vite, vitest,
      # esbuild) carries its own advisories — real, but they describe a dev
      # server that is never exposed in a deployment, and clearing them means
      # a vite 5->8 / vitest 2->4 major bump. Those are tracked separately;
      # gating releases on them would have blocked shipping for a risk that
      # is not in the artifact. Runtime dependencies are still gated at high.
      - run: npm audit --prefix frontend --audit-level=high --omit=dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f Dockerfile.prod -t reqmesh:ci .

      # Trivy is run directly rather than through aquasecurity/trivy-action.
      # The action failed on every run for days, always in ~15s — too fast to
      # have downloaded the 100MB vulnerability DB, let alone scanned with it —
      # and reported only "exit code 1", which is indistinguishable from a real
      # CVE. It read as "a HIGH/CRITICAL is blocking the release" while the
      # image in fact scans completely clean. This exact command, against this
      # exact image, does work: 0 findings across 138 Debian and 49 Python
      # packages.
      #
      # Two passes on purpose. The first always prints a table and never fails,
      # so the log says what trivy saw whatever happens; the second produces
      # the SARIF and is the gate. A scanner whose failure mode is a bare exit
      # code is a gate nobody can act on.
      #
      # ignore-unfixed: a Debian base image always carries some HIGH CVEs that
      # upstream has not patched. Failing on those makes the gate unsatisfiable
      # — there is no action that clears it — so it stops being read. Fail only
      # on CVEs a rebuild or version bump can actually fix; the Dockerfile runs
      # apt-get upgrade so those get picked up. Unfixed CVEs are still reported
      # in the SARIF upload below, they just don't block.
      - name: Scan the image for fixable HIGH/CRITICAL CVEs
        env:
          # Digest-pinned, matching the convention used for actions here. This
          # is trivy 0.72, the version verified against this image by hand.
          TRIVY: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
        run: |
          set -euo pipefail
          run_trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${{ github.workspace }}:/work" -w /work \
              -v "$HOME/.cache/trivy:/root/.cache" \
              "$TRIVY" image --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed "$@" reqmesh:ci
          }
          echo "::group::trivy report"
          run_trivy --exit-code 0 --format table
          echo "::endgroup::"
          run_trivy --exit-code 1 --format sarif --output trivy.sarif
      # Only upload a report that exists. `if: always()` alone made a missing
      # file fail the job a second time, for a reason unrelated to the scan.
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
