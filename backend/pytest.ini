[pytest]
# The contract suite is generated from the OpenAPI schema — ~160 operations,
# each with multiple generated cases — so it runs minutes rather than seconds.
# Excluded from the default run to keep `pytest tests/` a fast inner loop; CI
# runs it as its own job. Opt in locally with:  pytest -m contract
markers =
    contract: property-based coverage generated from the OpenAPI schema (slow)
    bench: performance measurements, not correctness gates (slow)
addopts = -m "not contract and not bench"

# Coverage is measured with pytest-cov (requirements-dev.txt). `--cov` is
# deliberately not in addopts above: it slows the fast inner loop that
# `pytest tests/` is kept quick for (206s -> 302s), so coverage is opt-in on
# the command line and CI passes it explicitly. The settings themselves live in
# .coveragerc, NOT here — coverage.py reads .coveragerc/setup.cfg/tox.ini/
# pyproject.toml and never pytest.ini, so a [coverage:*] section in this file
# is silently ignored. app/cli.py stays measured because the fast suite does
# exercise it (test_reset_admin.py, test_password_policy.py).
