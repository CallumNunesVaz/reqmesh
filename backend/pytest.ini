[pytest]
# The contract suite is generated from the OpenAPI schema — ~160 operations,
# each with multiple generated cases — so it runs minutes rather than seconds.
# Excluded from the default run to keep `pytest tests/` a fast inner loop; CI
# runs it as its own job. Opt in locally with:  pytest -m contract
markers =
    contract: property-based coverage generated from the OpenAPI schema (slow)
    bench: performance measurements, not correctness gates (slow)
addopts = -m "not contract and not bench"
