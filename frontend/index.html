<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The tab icon is the mesh mark alone, never the logo lockup: at 16px the
         wordmark beside it is unreadable and squeezes the symbol to nothing.
         The .ico was already the mark — but browsers prefer the SVG when both
         are declared, so pointing that at the lockup is what actually showed. -->
    <link rel="icon" type="image/x-icon" href="/reqmesh.ico" />
    <link rel="icon" type="image/svg+xml" href="/reqmesh-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reqmesh</title>
    <!-- Fonts are bundled, not fetched. Loading them from Google's CDN meant an
         air-gapped or CSP-restricted deployment silently fell back to system
         faces, and every page paid a third-party round trip on first load.
         See src/styles/fonts.css. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
